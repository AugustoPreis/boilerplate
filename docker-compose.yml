# Modo produção-like: builda as imagens finais e roda os binários de produção.
# `docker compose -f docker-compose.yml up --build` ignora o override de dev.
#
# Sem flags (`docker compose up`), o docker-compose.override.yml é aplicado
# automaticamente e este arquivo passa a rodar em modo dev com hot-reload —
# ver esse arquivo para o que muda.
services:
  postgres:
    image: postgres:18
    container_name: ${APP_NAME:-boilerplate}_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      # Porta publicada no HOST (para acessar via cliente externo) — DB_PORT
      # é a porta interna que os containers usam para se conectar entre si e
      # NUNCA deve mudar (é sempre 5432 dentro da rede do Docker). Se a porta
      # padrão do host já estiver em uso, mude só DB_HOST_PORT no .env.
      - '${DB_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - boilerplate_network

  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME:-boilerplate}_redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      # Mesma lógica do Postgres acima: REDIS_HOST_PORT é só a porta no host.
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - boilerplate_network

  # Roda migration:run + seed uma vez por `up` e finaliza — resolve "sobe com
  # um único comando" sem depender de o dev lembrar de rodar isso manualmente.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: deps
    container_name: ${APP_NAME:-boilerplate}_migrate
    command: sh -c "pnpm --filter=@boilerplate/api migration:run && pnpm --filter=@boilerplate/api seed"
    env_file:
      - .env
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - boilerplate_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ${APP_NAME:-boilerplate}_api
    env_file:
      - .env
    ports:
      # PORT é a porta interna em que a API escuta dentro do container;
      # API_HOST_PORT é só a porta publicada no host.
      - '${API_HOST_PORT:-3000}:${PORT:-3000}'
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - boilerplate_network

  # apps/web entra aqui a partir da Fase 5 (bootstrap do frontend) — ainda não
  # existe no repo, então não há serviço "web" até essa fase estar pronta.

volumes:
  postgres_data:
  redis_data:

networks:
  boilerplate_network:
    driver: bridge
