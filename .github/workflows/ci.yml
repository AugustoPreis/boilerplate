name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm --filter=@boilerplate/api test

  test-integration-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The API consumes `@boilerplate/shared` as a compiled workspace
      # dependency, not via ts-node, same as the Dockerfile.
      - name: Build @boilerplate/shared
        run: pnpm --filter=@boilerplate/shared build

      # Docker is available natively on ubuntu-latest, so Testcontainers
      # works with no extra setup: no `services:` block, no privileged flag.
      - name: Integration tests
        run: pnpm --filter=@boilerplate/api test:integration

      - name: E2E tests
        run: pnpm --filter=@boilerplate/api test:e2e

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Validates the production image still builds from a clean state: no
      # push, no registry credentials needed. Runs standalone (not depending
      # on the `ci` job above) since it builds the image from scratch anyway
      # and doesn't need that job's `pnpm install`.
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
