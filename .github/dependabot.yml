version: 2

updates:
  # Covers the whole pnpm workspace via the root lockfile (apps/api,
  # packages/shared, and the tooling packages all resolve from here).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'

    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'

    groups:
      patch-and-minor:
        update-types:
          - 'patch'
          - 'minor'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'

    groups:
      patch-and-minor:
        update-types:
          - 'patch'
          - 'minor'

  # Only apps/api/Dockerfile (the node:24-alpine base image).
  - package-ecosystem: 'docker'
    directory: '/apps/api'
    schedule:
      interval: 'weekly'

    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'

    groups:
      patch-and-minor:
        update-types:
          - 'patch'
          - 'minor'
