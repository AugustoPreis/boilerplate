packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': false
  bcrypt: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: false
  protobufjs: true
  ssh2: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1104.0'
  - '@tanstack/history@1.162.1'
  - '@tanstack/react-router@1.170.21'
  - '@tanstack/router-core@1.171.18'
  - '@tanstack/router-generator@1.167.24'
  - '@tanstack/router-plugin@1.168.26'
  - vite@8.2.1
  - lucide-react@1.29.0
