# Aplicado automaticamente pelo Docker Compose quando presente — é o modo
# padrão de quem clona o repo para desenvolver. `docker compose up` (sem
# flags) já sobe tudo em modo dev com hot-reload via bind mount do código.
#
# node_modules de cada pacote fica como volume anônimo (não bind-mounted),
# para não sobrescrever o que foi instalado na imagem com o estado do host.
services:
  migrate:
    build:
      dockerfile: apps/api/Dockerfile.dev
      # Sobrescreve o target: deps da imagem de produção (base) — o
      # Dockerfile.dev não tem esse estágio, só "dev".
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules

  api:
    build:
      dockerfile: apps/api/Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules
    ports:
      - '${API_HOST_PORT:-3000}:${PORT:-3000}'
