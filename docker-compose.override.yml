# Applied automatically by Docker Compose when present — is the mode
# default for those who clone the repo to develop. `docker compose up` (without
# flags) already brings everything up in dev mode with hot-reload via bind mount of the code.
services:
  migrate:
    build:
      dockerfile: apps/api/Dockerfile.dev
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules

  api:
    build:
      dockerfile: apps/api/Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules
    ports:
      - '${API_HOST_PORT:-3000}:${PORT:-3000}'
